plugins { id 'com.android.application' }
android {
    namespace 'io.github.franciszekzak.openziot'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.franciszekzak.openziot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ZIOT_KEYSTORE')) {
                storeFile file(System.getenv('ZIOT_KEYSTORE'))
                storePassword System.getenv('ZIOT_STORE_PASSWORD')
                keyAlias 'openziot'
                keyPassword System.getenv('ZIOT_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { if (System.getenv('ZIOT_KEYSTORE')) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
